name: Astro-Exoplanets CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Astrophysics & FastAPI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Security scan with bandit
        run: uvx bandit -r src -ll
      - name: Run pytest suite (offline deterministic mode)
        env:
          EXO_FORCE_OFFLINE: "1"
        run: uv run pytest -v

  frontend:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Typecheck & build
        run: npm run build
