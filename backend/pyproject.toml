[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-exoplanets-backend"
version = "2.0.0"
description = "Astrophysics & observability API backend for Astro-Exoplanets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "astropy>=6.1",
    "lightkurve>=2.4",
    "requests>=2.32",
    "certifi>=2024.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astro_exoplanets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
